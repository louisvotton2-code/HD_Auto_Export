services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: hd_local
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: hd_auto
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - hd_pg18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hd_local -d hd_auto']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  hd_pg18:
