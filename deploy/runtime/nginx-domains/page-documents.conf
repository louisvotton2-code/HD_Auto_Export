# HTTP context; only the public server may opt in to the separate bounded log.
map $uri $hd_page_document_locale {
    default "";
    ~^/(?<hd_page_document_lang>zh|en|ru)(?:/|$) $hd_page_document_lang;
}

map $uri $hd_page_document_type {
    default "";
    ~^/(?:zh|en|ru)/?$ home;
    ~^/(?:zh|en|ru)/cars/?$ catalog;
    ~^/(?:zh|en|ru)/cars/[^/]+/?$ vehicle;
    ~^/(?:zh|en|ru)/calculator(?:/[^/]+)?/?$ calculator;
    ~^/(?:zh|en|ru)/parts(?:/[^/]+)?/?$ parts;
    ~^/(?:zh|en|ru)/(?:buy|guide)/?$ guide;
    ~^/(?:zh|en|ru)/about/?$ about;
    ~^/(?:zh|en|ru)/(?:privacy|cars/[^/]+/inspection)/?$ other;
}

map $http_user_agent $hd_page_document_bot {
    default 0;
    "" 1;
    ~*(bot|crawl|spider|slurp|googleother|google-inspectiontool|yandex|facebookexternalhit|meta-external|preview|headlesschrome|curl/|wget/|kube-probe) 1;
}

map "$http_rsc:$http_next_router_state_tree:$http_next_router_prefetch:$http_next_router_segment_prefetch:$http_x_middleware_prefetch:$http_purpose:$http_sec_purpose" $hd_page_document_navigation {
    default 0;
    "::::::" 1;
}

map $request_uri $hd_page_document_rsc_query {
    default 0;
    ~[?&]_rsc(?:=|&|$) 1;
}

map $http_sec_fetch_dest $hd_page_document_destination {
    default 0;
    "" 1;
    document 1;
}

map $sent_http_content_type $hd_page_document_html {
    default 0;
    "~*^text/html(?:\s*;|$)" 1;
}

map "$request_method:$status:$request_completion:$hd_page_document_type:$hd_page_document_bot:$hd_page_document_navigation:$hd_page_document_rsc_query:$hd_page_document_destination:$hd_page_document_html" $hd_page_document_eligible {
    default 0;
    ~^GET:200:OK:[a-z]+:0:1:0:1:1$ 1;
}

map "$hd_page_documents_enabled:$hd_page_document_eligible" $hd_page_document_selected {
    default 0;
    "1:1" 1;
}

# A hit is attested by the known cache upstream; a miss or bypass is cold.
map "$proxy_host:$upstream_http_x_hd_cache_document" $hd_page_document_cache {
    default cold;
    ~^html-cache-(?:blue|green):3010:hit$ hot;
}

log_format hd_page_document escape=json '{"kind":"page_document_v1","time":$msec,"locale":"$hd_page_document_locale","pageType":"$hd_page_document_type","cache":"$hd_page_document_cache"}';

map "$hd_page_documents_enabled:$remote_addr:$request_method:$status" $hd_page_document_heartbeat {
    default 0;
    "1:127.0.0.1:GET:200" 1;
}

log_format hd_page_document_coverage '{"kind":"page_document_coverage_v1","time":$msec}';
