# Public HTTPS server only. The current index is the static-publication switch.
location = /sitemap.xml {
    error_page 418 = @hd_web_sitemap;
    if (!-f /srv/hd-assets/sitemap/current.xml) { return 418; }
    alias /srv/hd-assets/sitemap/current.xml;
    types {}
    default_type application/xml;
    etag off;
    if_modified_since off;
    add_header Cache-Control 'no-store' always;
    add_header X-Content-Type-Options 'nosniff' always;
}

location ~ "^/sitemap-(?<hd_sitemap_generation>[0-9a-f]{64})-(?<hd_sitemap_shard>[0-9]{5})[.]xml$" {
    if (!-f /srv/hd-assets/sitemap/current.xml) { return 404; }
    alias /srv/hd-assets/sitemap/generations/$hd_sitemap_generation/$hd_sitemap_shard.xml;
    types {}
    default_type application/xml;
    add_header Cache-Control 'no-store' always;
    add_header X-Content-Type-Options 'nosniff' always;
}

location @hd_web_sitemap {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:3000;
    include /etc/nginx/hd-domains/web-proxy.conf;
}
