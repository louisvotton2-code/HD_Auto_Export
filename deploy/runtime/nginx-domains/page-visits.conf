# HTTP context. These formats are private datagrams only. Never write them
# to a file, stdout, the system logger, or a network destination.
map "$hd_page_visits_enabled:$hd_page_document_eligible:$realip_remote_addr" $hd_page_visit_selected {
    default 0;
    ~^1:1:[0-9a-fA-F:.]+$ 1;
}

map "$hd_page_visits_enabled:$realip_remote_addr:$request_method:$status" $hd_page_visit_heartbeat {
    default 0;
    "1:127.0.0.1:GET:200" 1;
}

log_format hd_page_visit escape=none 'v1 visit $msec $realip_remote_addr';
log_format hd_page_visit_coverage escape=none 'v1 coverage $msec';
