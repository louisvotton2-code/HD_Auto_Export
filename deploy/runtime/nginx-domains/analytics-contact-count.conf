location = /api/v1/analytics/contact-count {
    if ($request_method != POST) { return 405; }
    set $hd_contact_origin $scheme://$http_host;
    if ($http_origin != $hd_contact_origin) { return 403; }
    if ($args != "") { return 400; }
    client_max_body_size 512;
    limit_req zone=hd_analytics burst=10 nodelay;
    set $api http://api:3320;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/hd-domains/api-proxy.conf;
    proxy_next_upstream off;
    proxy_set_header Cookie '';
    proxy_set_header Authorization '';
    proxy_set_header Referer '';
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Strict-Transport-Security $hd_hsts always;
    add_header Cache-Control 'no-store' always;
    add_header Allow POST always;
}
