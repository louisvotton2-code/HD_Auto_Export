# The website BFF owns browser-origin and request schema checks.
location ~ "^/api/v1/external-media/ximg-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/failure/?$" {
    if ($request_method != POST) { return 405; }
    client_max_body_size 256;
    limit_req zone=external_media_report burst=5 nodelay;
    limit_req_status 429;
    limit_req_log_level info;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:3000;
    proxy_set_header Cookie '';
    proxy_set_header Authorization '';
    include /etc/nginx/hd-domains/web-proxy.conf;
}
