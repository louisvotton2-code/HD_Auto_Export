# http context. Buckets use Nginx's direct peer, never client-supplied headers.
# Emit HSTS only when the TLS virtual host, SNI and HTTP host all agree.
map "$https:$server_name:$ssl_server_name:$host" $hd_hsts {
    default "";
    ~*^on:cars[.]hongdingauto[.]com:cars[.]hongdingauto[.]com:cars[.]hongdingauto[.]com$ "max-age=300";
    ~*^on:admin[.]hongdingauto[.]com:admin[.]hongdingauto[.]com:admin[.]hongdingauto[.]com$ "max-age=300";
}
# Nginx 1.28 locations that set any add_header must set HSTS explicitly.
add_header Strict-Transport-Security $hd_hsts always;

map $upstream_http_x_content_type_options $hd_nosniff {
    "" nosniff;
    default "";
}

# Keep Vary on identity, partial and conditional responses too.
map $uri $hd_next_static_vary {
    default "";
    ~\.(?:css|js)$ Accept-Encoding;
}

# Nginx gzip clears byte-range support. Serve range requests with identity encoding.
map "$hd_next_static_vary:$http_range" $hd_next_static_gzip {
    default 0;
    "Accept-Encoding:" 1;
}

# The image ships an empty table. An opt-in read-only directory replaces it
# with one reviewed country table. No proxy header is consulted.
geo $remote_addr $hd_analytics_country {
    default "";
    include /etc/nginx/hd-analytics-geo/country.conf;
}

geo $remote_addr $hd_analytics_nonpublic {
    default 0;
    0.0.0.0/8 1;
    10.0.0.0/8 1;
    100.64.0.0/10 1;
    127.0.0.0/8 1;
    169.254.0.0/16 1;
    172.16.0.0/12 1;
    192.0.2.0/24 1;
    192.168.0.0/16 1;
    198.18.0.0/15 1;
    198.51.100.0/24 1;
    203.0.113.0/24 1;
    224.0.0.0/4 1;
    240.0.0.0/4 1;
    ::/128 1;
    ::1/128 1;
    2001:db8::/32 1;
    fc00::/7 1;
    fe80::/10 1;
    ff00::/8 1;
}

map "$request_method:$host:$uri" $hd_analytics_geo_route {
    default 0;
    ~^POST:cars[.]hongdingauto[.]com:/api/v1/analytics/(?:events|contact-count)$ 1;
}

map "$hd_analytics_geo_route:$is_args:$http_origin" $hd_analytics_geo_same_origin {
    default 0;
    ~^1::https://cars[.]hongdingauto[.]com$ 1;
}

map $host $hd_analytics_geo_key {
    default "";
    # HTTP map includes accept an optional glob. The image contains no key.
    include /etc/nginx/hd-analytics-geo/gateway-key.[c]onf;
}

map "$hd_analytics_geo_same_origin:$hd_analytics_geo_key" $hd_analytics_gateway_key_for_upstream {
    default "";
    "~^1:[a-f0-9]{64}$" $hd_analytics_geo_key;
}

map "$hd_analytics_nonpublic:$hd_analytics_gateway_key_for_upstream" $hd_analytics_country_for_upstream {
    default "";
    "~^0:[a-f0-9]{64}$" $hd_analytics_country;
}

map $status $hd_public_media_cache_control {
    default 'no-store';
    200 'private, no-cache';
}

map $uri $hd_edge_family {
    default ssr;
    ~^/(?:_next/static|images|assets|brand|demo-vehicles|fonts|icons|parts|admin/assets)(?:/|$) static;
    ~^/(?:favicon[.]ico|manifest[.]webmanifest)$ static;
    ~^/(?:_hd_media|api/v1/media)(?:/|$) media;
    ~^/api/v1/(?:vehicles|vehicle-filters|home/vehicles)/?$ catalog;
    ~^/api/v1/vehicles/[^/]+(?:/(?:gallery|configuration|inspection|price-history))?/?$ public-api;
    ~^/api/v1/external-media/ external-report;
    /api/v1/analytics/events analytics;
    /api/v1/analytics/contact-count analytics;
    ~*^/api/auth(?:/|$) auth;
    ~^/(?:admin|api)(?:/|$) admin-or-other-api;
    ~^/[.]well-known/acme-challenge/ acme;
}
map $hd_edge_family $hd_ssr_peer     { ssr        $binary_remote_addr; default ""; }
map $hd_edge_family $hd_catalog_peer { catalog    $binary_remote_addr; default ""; }
map $hd_edge_family $hd_public_peer  { public-api $binary_remote_addr; default ""; }
map $hd_edge_family $hd_auth_peer    { auth       $binary_remote_addr; default ""; }
limit_req_zone $hd_ssr_peer zone=hd_ssr:1m rate=8r/s;
limit_req_zone $hd_catalog_peer zone=hd_catalog:1m rate=12r/s;
limit_req_zone $hd_public_peer zone=hd_public:1m rate=12r/s;
limit_req_zone $hd_auth_peer zone=hd_auth:1m rate=15r/m;
limit_req_zone $binary_remote_addr zone=external_media_report:1m rate=15r/m;
limit_req_zone $binary_remote_addr zone=hd_analytics:1m rate=5r/s;

limit_req zone=hd_ssr burst=16 nodelay;
limit_req zone=hd_catalog burst=24 nodelay;
limit_req zone=hd_public burst=24 nodelay;
limit_req zone=hd_auth burst=8 nodelay;
limit_req_status 429;
limit_req_log_level info;

# A constant per proxy instance and a binary address per direct peer.
limit_conn_zone $hostname zone=hd_edge_total:64k;
limit_conn_zone $binary_remote_addr zone=hd_edge_peer:1m;
limit_conn hd_edge_total 192;
limit_conn hd_edge_peer 32;
limit_conn_status 429;
limit_conn_log_level info;

client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_header_timeout 10s;
client_body_timeout 15s;
client_max_body_size 10m;
keepalive_requests 100;
send_timeout 30s;
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;

# Request error messages can contain the raw URI and client address. Keep
# process startup diagnostics and use the bounded access schema for requests.
error_log /dev/null crit;
log_format hd_edge escape=json '{"family":"$hd_edge_family","status":$status,"request_seconds":$request_time}';
