# http context. Buckets use Nginx's direct peer, never client-supplied headers.
map $uri $hd_edge_family {
    default ssr;
    ~^/(?:_next/static|images|assets|brand|demo-vehicles|fonts|icons|parts|admin/assets)(?:/|$) static;
    ~^/(?:favicon[.]ico|manifest[.]webmanifest)$ static;
    ~^/(?:_hd_media|api/v1/media)(?:/|$) media;
    ~^/api/v1/(?:vehicles|vehicle-filters|home/vehicles)/?$ catalog;
    ~^/api/v1/vehicles/[^/]+/?$ public-api;
    ~^/api/v1/external-media/ external-report;
    ~*^/api/auth(?:/|$) auth;
    ~^/(?:admin|api)(?:/|$) admin-or-other-api;
    ~^/[.]well-known/acme-challenge/ acme;
}
map $hd_edge_family $hd_ssr_peer     { ssr        $binary_remote_addr; default ""; }
map $hd_edge_family $hd_catalog_peer { catalog    $binary_remote_addr; default ""; }
map $hd_edge_family $hd_public_peer  { public-api $binary_remote_addr; default ""; }
map $hd_edge_family $hd_auth_peer    { auth       $binary_remote_addr; default ""; }
limit_req_zone $hd_ssr_peer zone=hd_ssr:1m rate=8r/s;
limit_req_zone $hd_catalog_peer zone=hd_catalog:1m rate=12r/s;
limit_req_zone $hd_public_peer zone=hd_public:1m rate=12r/s;
limit_req_zone $hd_auth_peer zone=hd_auth:1m rate=15r/m;
limit_req_zone $binary_remote_addr zone=external_media_report:1m rate=15r/m;

limit_req zone=hd_ssr burst=16 nodelay;
limit_req zone=hd_catalog burst=24 nodelay;
limit_req zone=hd_public burst=24 nodelay;
limit_req zone=hd_auth burst=8 nodelay;
limit_req_status 429;
limit_req_log_level info;

# A constant per proxy instance and a binary address per direct peer.
limit_conn_zone $hostname zone=hd_edge_total:64k;
limit_conn_zone $binary_remote_addr zone=hd_edge_peer:1m;
limit_conn hd_edge_total 192;
limit_conn hd_edge_peer 32;
limit_conn_status 429;
limit_conn_log_level info;

client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_header_timeout 10s;
client_body_timeout 15s;
client_max_body_size 10m;
keepalive_requests 100;
send_timeout 30s;
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;

# Request error messages can contain the raw URI and client address. Keep
# process startup diagnostics and use the bounded access schema for requests.
error_log /dev/null crit;
log_format hd_edge escape=json '{"family":"$hd_edge_family","status":$status,"request_seconds":$request_time}';
