# Media files are reachable only through an internal redirect after API authorization.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    # Avoid putting staff searches, query strings, or cookies in access logs.
    access_log off;
    location = /_hd_media { return 404; }
    location /_hd_media/ { return 404; }
    location ~ "^/_hd_media/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:\.thumb)?\.webp)$" {
        internal;
        alias /srv/private-media/$1;
        default_type image/webp;
        add_header Cache-Control 'no-store' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header X-Request-Id $upstream_http_x_request_id always;
        add_header X-RateLimit-Limit $upstream_http_x_ratelimit_limit always;
        add_header X-RateLimit-Remaining $upstream_http_x_ratelimit_remaining always;
        add_header X-RateLimit-Reset $upstream_http_x_ratelimit_reset always;
        disable_symlinks on;
        etag off;
        if_modified_since off;
        max_ranges 0;
    }
    location = /health/proxy { access_log off; return 200 'ok'; }
    location = /admin { return 308 /admin/; }
    location ^~ /admin/assets/ {
        root /srv;
        try_files $uri =404;
        add_header Cache-Control 'no-store' always;
    }
    location ^~ /admin/ {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control 'no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    location /api/ {
        set $api http://api:3320;
        # Only the public read endpoints accept the website's trailing slash.
        # Internal rewrite preserves query parameters and does not redirect clients.
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded '';
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-HD-Client-IP '';
        proxy_set_header X-HD-Visitor-IP '';
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        proxy_set_header X-HD-Visitor-IP $remote_addr;
        proxy_set_header X-HD-Client-IP '';
        proxy_pass $web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded '';
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
