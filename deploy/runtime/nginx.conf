# Media files are reachable only through an internal redirect after API authorization.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/server.crt;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    include /etc/nginx/hd-domains/edge-server.conf;
    include /etc/nginx/hd-domains/media.conf;
    location = /health/proxy { access_log off; return 200 'ok'; }
    location = /admin { return 308 /admin/; }
    location ^~ /admin/assets/ {
        root /srv;
        try_files $uri =404;
        add_header Cache-Control 'no-store' always;
    }
    location ^~ /admin/ {
        root /srv;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control 'no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    include /etc/nginx/hd-domains/external-media-report.conf;
    location /api/v1/external-media/ { return 404; }
    location /api/ {
        set $api http://api:3320;
        # Only the public read endpoints accept the website's trailing slash.
        # Internal rewrite preserves query parameters and does not redirect clients.
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration|inspection|price-history))?)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
    }
}
