# Local synthetic environment only. Apply after compose.yaml, compose.proxy.yaml and compose.media.yaml.
services:
  postgres:
    cpus: 1.5
    mem_limit: 1152m
    shm_size: 128m
    command: [postgres, -c, shared_buffers=192MB, -c, work_mem=4MB, -c, max_connections=40]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d hd_auto &&
          psql -U postgres -d hd_auto -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'hd_app'" | grep -qx 1
  api:
    cpus: 1.5
    mem_limit: 640m
    environment:
      TRANSLATION_PROVIDER: disabled
  migrate:
    cpus: 1.0
    mem_limit: 640m
    environment:
      TRANSLATION_PROVIDER: disabled
  web:
    cpus: 1.0
    mem_limit: 768m
  proxy:
    cpus: 0.5
    mem_limit: 192m
    ports: !override ['127.0.0.1:${HTTPS_PORT:?use a dedicated local port}:8443']
    networks:
      default:
        ipv4_address: ${PROXY_IP:?set the fixed local proxy address}
      ingress:
        gw_priority: 1
    volumes:
      - ./ops-ext/limits.conf:/etc/nginx/conf.d/00-ops-ext-limits.conf:ro
  redis:
    image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    user: '${APP_UID:?set local owner UID}:${APP_GID:?set local owner GID}'
    entrypoint: [sh, /etc/hd-ext/redis-start.sh]
    read_only: true
    tmpfs: [/tmp:mode=1777, /data:mode=1777]
    cpus: 0.5
    mem_limit: 192m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [ext_cache_password]
    volumes:
      - ./ops-ext/redis-start.sh:/etc/hd-ext/redis-start.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/ext_cache_password) redis-cli -h redis --user hd-cache ping | grep -qx PONG']
      interval: 5s
      timeout: 2s
      retries: 5
    logging:
      driver: local
      options: {max-size: '10m', max-file: '3'}
networks:
  default:
    internal: true
  ingress: {}
secrets:
  ext_cache_password:
    file: ${DATA_ROOT:?use an isolated data root}/secrets/ext_cache_password
