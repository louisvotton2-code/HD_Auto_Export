x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'
x-api: &api
  image: hd-auto-api:${RELEASE_ID:?set RELEASE_ID}
  build:
    context: ../..
    dockerfile: deploy/runtime/Dockerfile
    target: api
  platform: ${TARGET_PLATFORM:-linux/arm64}
  init: true
  environment:
    APP_UID: ${APP_UID:-1000}
    APP_GID: ${APP_GID:-1000}
    NODE_ENV: production
    AUTH_BASE_URL: ${SITE_ORIGIN:?set HTTPS SITE_ORIGIN}
    TRUSTED_ORIGINS: ${SITE_ORIGIN}
    MEDIA_ROOT: /data/media
    TRUST_PROXY: 'false'
    DB_POOL_MAX: '5'
  secrets: [app_db_password, auth_secret]
  volumes:
    - type: bind
      source: ${DATA_ROOT:?set absolute DATA_ROOT}/media
      target: /data/media
      bind: {create_host_path: false}
  depends_on:
    postgres: {condition: service_healthy}
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
services:
  postgres:
    image: hd-auto-postgres:${RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile
      target: postgres
    platform: ${TARGET_PLATFORM:-linux/arm64}
    restart: 'on-failure:5'
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    secrets: [postgres_password, app_db_password]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/postgres
        target: /var/lib/postgresql
        bind: {create_host_path: false}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging
  migrate:
    <<: *api
    profiles: [tools]
    command: ['dist/db/migrate.js']
    restart: 'no'
  api:
    <<: *api
    restart: 'on-failure:5'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3320/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  web:
    image: hd-auto-web:${RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile
      target: web
      args:
        SITE_ORIGIN: ${SITE_ORIGIN}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    platform: ${TARGET_PLATFORM:-linux/arm64}
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    init: true
    environment:
      VEHICLE_API_BASE_URL: http://api:3320
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      NEXT_PUBLIC_SITE_URL: ${SITE_ORIGIN}
    depends_on:
      api: {condition: service_healthy}
    restart: 'on-failure:5'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/zh/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  proxy:
    image: hd-auto-proxy:${RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile
      target: proxy
    platform: ${TARGET_PLATFORM:-linux/arm64}
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-3410}:8443']
    volumes:
      - type: bind
        source: ${DATA_ROOT}/tls
        target: /run/tls
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    restart: 'on-failure:5'
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/health/proxy']
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging
secrets:
  postgres_password:
    file: ${DATA_ROOT}/secrets/postgres_password
  app_db_password:
    file: ${DATA_ROOT}/secrets/app_db_password
  auth_secret:
    file: ${DATA_ROOT}/secrets/auth_secret
