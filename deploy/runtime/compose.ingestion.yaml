# Apply after the actual production overlays. This profile never starts with the site.
# Use only the reviewed BE CLI and fixed, validated PA package; no daemon/cron.
services:
  worker:
    image: hd-auto-api:${RELEASE_ID:?use the reviewed main release}
    platform: ${TARGET_PLATFORM:-linux/amd64}
    profiles: [ingestion]
    user: '${APP_UID:?use the non-root application identity}:${APP_GID:?use its GID}'
    init: true
    entrypoint: [node, /app/production/worker-entrypoint.mjs]
    # Without an explicit operation and job/package the CLI refuses to work.
    command: [status]
    restart: 'no'
    read_only: true
    tmpfs: ['/tmp:mode=1777,size=134217728']
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      HD_DATABASE_NAME: ${HD_DATABASE_NAME:?retain the current production database}
      HD_DEPLOYMENT_ENV: production
      HD_RELEASE_ID: ${RELEASE_ID}
      DB_POOL_MAX: '2'
      EXTERNAL_SYNC_MODE: 'off'
      TRANSLATION_PROVIDER: disabled
      INGESTION_DISK_PATH: /private/import
    volumes:
      - type: bind
        source: ${INGESTION_PACKAGE_ROOT:?set the verified private fixed-list package directory}
        target: /private/import
        read_only: true
        bind: {create_host_path: false}
    secrets:
      - {source: release_app_db_password, target: app_db_password}
      - chinacarapi_key
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      default: {}
      worker_egress: {gw_priority: 1}
    logging:
      driver: local
      options: {max-size: '10m', max-file: '3'}
networks:
  worker_egress:
    internal: false
secrets:
  chinacarapi_key:
    file: ${CHINACARAPI_KEY_FILE:?use the existing restricted provider key file}
