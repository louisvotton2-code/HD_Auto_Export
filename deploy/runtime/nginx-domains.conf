# Cache only immutable build assets. Error responses remain non-cacheable.
map $status $hd_asset_cache_control {
    default 'no-store';
    200 'public, max-age=31536000, immutable';
    206 'public, max-age=31536000, immutable';
    304 'public, max-age=31536000, immutable';
}

# Only full HTML documents use the readable missing-vehicle fallback. RSC and
# prefetch requests keep their original Next response and require no second read.
map "$request_method:$http_rsc:$http_next_router_prefetch:$http_next_router_segment_prefetch:$http_purpose:$http_sec_purpose:$http_accept" $hd_vehicle_html_document {
    default 0;
    ~*^(GET|HEAD)::::::.*text/html 1;
}

# Unknown HTTP hosts serve only internal liveness; no catch-all redirect.
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080 default_server;
    server_name _;
    location = /health/proxy { access_log off; return 200 'ok'; }
    location / { return 444; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080;
    server_name cars.hongdingauto.com;
    location = /staff { return 404; }
    location ^~ /staff/ { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; try_files $uri =404; }
    location / { return 308 https://cars.hongdingauto.com$request_uri; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080;
    server_name admin.hongdingauto.com;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; try_files $uri =404; }
    location / { return 308 https://admin.hongdingauto.com$request_uri; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl;
    server_name cars.hongdingauto.com;
    if ($ssl_server_name !~* "^cars[.]hongdingauto[.]com$") { return 421; }
    if ($host != cars.hongdingauto.com) { return 421; }
    ssl_certificate /run/tls/current/server.crt;
    ssl_certificate_key /run/tls/current/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /staff { return 404; }
    location ^~ /staff/ { return 404; }
    include /etc/nginx/hd-domains/media.conf;
    # Only the current public GET/HEAD API paths are proxied on the public host.
    location ~ "^/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration))?)?|vehicle-filters|home/vehicles|media/[^/]+)/?$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $api http://api:3320;
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration))?)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    include /etc/nginx/hd-domains/external-media-report.conf;
    location = /api { return 404; }
    location /api/ { return 404; }
    location /admin/ { return 404; }
    location = /admin { return 404; }
    # Next build identifiers/content hashes make this namespace immutable, never HTML.
    location ^~ /_next/static/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        add_header Cache-Control $hd_asset_cache_control always;
    }
    location ~ "^/(zh|en|ru)/cars/[^/]+/?$" {
        recursive_error_pages on;
        set $hd_vehicle_missing_locale $1;
        error_page 418 = @hd_vehicle_document;
        if ($hd_vehicle_html_document) { return 418; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
    }
    location @hd_vehicle_document {
        recursive_error_pages on;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_intercept_errors on;
        error_page 404 =404 @hd_vehicle_missing;
    }
    location @hd_vehicle_missing {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000/404/$hd_vehicle_missing_locale/;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_intercept_errors off;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        add_header Cache-Control 'private, no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
    }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl;
    server_name admin.hongdingauto.com;
    absolute_redirect off;
    if ($ssl_server_name !~* "^admin[.]hongdingauto[.]com$") { return 421; }
    if ($host != admin.hongdingauto.com) { return 421; }
    ssl_certificate /run/tls/current/server.crt;
    ssl_certificate_key /run/tls/current/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    include /etc/nginx/hd-domains/media.conf;
    location = / { return 308 /admin/; }
    location = /admin { return 308 /admin/; }
    # Vite hashes are required; other public files keep the ordinary no-store policy.
    location ~ "^/admin/assets/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]{8,}\\.(?:js|css|woff2?|svg|png|webp)$" {
        root /srv; try_files $uri =404;
        add_header Cache-Control $hd_asset_cache_control always;
    }
    location /admin/assets/ { root /srv; try_files $uri =404; add_header Cache-Control 'no-store' always; }
    location ^~ /admin/ { root /srv; try_files $uri $uri/ /admin/index.html; add_header Cache-Control 'no-store' always; add_header X-Robots-Tag 'noindex, nofollow' always; }
    # Staff preview must share the admin origin for cookies, iframe messages and private JSON.
    location ~ "^/staff/vehicles/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/publication-preview/?$" {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control 'private, no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    location ^~ /_next/static/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        add_header Cache-Control $hd_asset_cache_control always;
    }
    # The preview root layout uses only these two fixed, unhashed local font files.
    location ~ "^/fonts/inter-(?:latin|cyrillic)[.]woff2$" {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        add_header Cache-Control 'no-store' always;
    }
    location ^~ /api/v1/external-media/ { return 404; }
    location /api/ {
        set $api http://api:3320;
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration))?)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    location / { return 404; }
}
