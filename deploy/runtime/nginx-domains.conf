include /etc/nginx/hd-domains/page-documents.conf;
include /etc/nginx/hd-domains/page-visits.conf;

# Cache only immutable build assets. Error responses remain non-cacheable.
map $status $hd_asset_cache_control {
    default 'no-store';
    200 'public, max-age=31536000, immutable';
    206 'public, max-age=31536000, immutable';
    304 'public, max-age=31536000, immutable';
}

# Only full HTML documents use the readable missing-vehicle fallback. RSC and
# prefetch requests keep their original Next response and require no second read.
map "$request_method:$http_rsc:$http_next_router_prefetch:$http_next_router_segment_prefetch:$http_purpose:$http_sec_purpose:$http_accept" $hd_vehicle_html_document {
    default 0;
    ~*^(GET|HEAD)::::::.*text/html 1;
}

# Unknown HTTP hosts serve only internal liveness; no catch-all redirect.
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080 default_server;
    server_name _;
    location = /health/proxy {
        set $hd_page_documents_enabled 0;
        access_log /dev/stdout hd_page_document_coverage if=$hd_page_document_heartbeat;
        set $hd_page_visits_enabled 0;
        access_log syslog:server=unix:/run/hd-visits/events.sock,facility=local7,severity=info,tag=hd_visit,nohostname hd_page_visit_coverage if=$hd_page_visit_heartbeat;
        add_header X-Content-Type-Options nosniff always;
        return 200 'ok';
    }
    location / { return 444; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080;
    server_name cars.hongdingauto.com;
    location = /staff { return 404; }
    location ^~ /staff/ { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; try_files $uri =404; }
    location / { return 308 https://cars.hongdingauto.com$request_uri; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080;
    server_name admin.hongdingauto.com;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; try_files $uri =404; }
    location / { return 308 https://admin.hongdingauto.com$request_uri; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl;
    server_name cars.hongdingauto.com;
    set $hd_page_documents_enabled 0;
    set $hd_page_visits_enabled 0;
    access_log /dev/stdout hd_page_document if=$hd_page_document_selected;
    access_log syslog:server=unix:/run/hd-visits/events.sock,facility=local7,severity=info,tag=hd_visit,nohostname hd_page_visit if=$hd_page_visit_selected;
    if ($ssl_server_name !~* "^cars[.]hongdingauto[.]com$") { return 421; }
    if ($host != cars.hongdingauto.com) { return 421; }
    ssl_certificate /run/tls/current/server.crt;
    ssl_certificate_key /run/tls/current/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    http2 on;
    server_tokens off;
    gzip_types application/json;
    gzip_min_length 256;
    gzip_comp_level 4;
    gzip_vary on;
    gzip_proxied no-store;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /staff { return 404; }
    location ^~ /staff/ { return 404; }
    include /etc/nginx/hd-domains/media.conf;
    # Only the current public GET/HEAD API paths are proxied on the public host.
    location ~ "^/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration|inspection|price-history))?)?|vehicle-filters|home/vehicles)/?$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $api http://api:3320;
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration|inspection|price-history))?)?|vehicle-filters|home/vehicles))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
        gzip on;
    }
    # The API sends verified versioned bytes and owns Cache-Control and ETag.
    # Unversioned X-Accel-Redirect responses keep their separate internal policy.
    location ~ "^/api/v1/media/[^/]+/?$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $api http://api:3320;
        rewrite "^(/api/v1/media/[^/]+)/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    include /etc/nginx/hd-domains/external-media-report.conf;
    include /etc/nginx/hd-domains/analytics-contact-count.conf;
    location = /api/v1/analytics/events {
        if ($request_method != POST) { return 405; }
        if ($http_origin != "https://cars.hongdingauto.com") { return 403; }
        if ($args != "") { return 400; }
        client_max_body_size 8k;
        limit_req zone=hd_analytics burst=10 nodelay;
        set $api http://api:3320;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Referer "";
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header Cache-Control 'no-store' always;
        add_header Allow POST always;
    }
    location = /api { return 404; }
    location /api/ { return 404; }
    location /admin/ { return 404; }
    location = /admin { return 404; }
    include /etc/nginx/hd-domains/sitemap.conf;
    location = /robots.txt {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header X-Content-Type-Options $hd_nosniff always;
    }
    location = /catalog-facets.json {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        gzip on;
    }
    # Next build identifiers/content hashes make this namespace immutable, never HTML.
    location ^~ /_next/static/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_set_header Accept-Encoding '';
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        gzip_types application/javascript text/javascript text/css;
        gzip_min_length 256;
        gzip_comp_level 4;
        gzip_vary off;
        gzip_proxied any;
        if ($hd_next_static_gzip) { gzip on; }
        add_header Vary $hd_next_static_vary always;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header Cache-Control $hd_asset_cache_control always;
    }
    location ~ "^/(zh|en|ru)/cars/[^/]+/?$" {
        recursive_error_pages on;
        set $hd_vehicle_missing_locale $1;
        error_page 418 = @hd_vehicle_document;
        if ($hd_vehicle_html_document) { return 418; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
    }
    location @hd_vehicle_document {
        recursive_error_pages on;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_intercept_errors on;
        error_page 404 =404 @hd_vehicle_missing;
    }
    location @hd_vehicle_missing {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000/404/$hd_vehicle_missing_locale/;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_intercept_errors off;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header Cache-Control 'private, no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    # HD_HTML_CACHE_LOCATIONS
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
    }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl;
    server_name admin.hongdingauto.com;
    absolute_redirect off;
    if ($ssl_server_name !~* "^admin[.]hongdingauto[.]com$") { return 421; }
    if ($host != admin.hongdingauto.com) { return 421; }
    ssl_certificate /run/tls/current/server.crt;
    ssl_certificate_key /run/tls/current/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    http2 on;
    server_tokens off;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    include /etc/nginx/hd-domains/media.conf;
    location = /robots.txt {
        default_type text/plain;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store' always;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = / { return 308 /admin/; }
    location = /admin { return 308 /admin/; }
    # Vite hashes are required; other public files keep the ordinary no-store policy.
    location ~ "^/admin/assets/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]{8,}\\.(?:js|css|woff2?|svg|png|webp)$" {
        root /srv; try_files $uri =404;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control $hd_asset_cache_control always;
    }
    location /admin/assets/ {
        root /srv; try_files $uri =404;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store' always;
    }
    location ^~ /admin/ {
        root /srv; try_files $uri $uri/ /admin/index.html;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    # Staff preview must share the admin origin for cookies, iframe messages and private JSON.
    location ~ "^/staff/vehicles/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/publication-preview/?$" {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header X-Content-Type-Options $hd_nosniff always;
        add_header Cache-Control 'private, no-store' always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
    }
    location ^~ /_next/static/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_set_header Accept-Encoding '';
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        gzip_types application/javascript text/javascript text/css;
        gzip_min_length 256;
        gzip_comp_level 4;
        gzip_vary off;
        gzip_proxied any;
        if ($hd_next_static_gzip) { gzip on; }
        add_header Vary $hd_next_static_vary always;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header Cache-Control $hd_asset_cache_control always;
    }
    # The preview root layout uses only these two fixed, unhashed local font files.
    location ~ "^/fonts/inter-(?:latin|cyrillic)[.]woff2$" {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_hide_header Cache-Control;
        add_header Strict-Transport-Security $hd_hsts always;
        add_header Cache-Control 'no-store' always;
    }
    location ^~ /api/v1/external-media/ { return 404; }
    location ^~ /api/v1/analytics/ {
        add_header Strict-Transport-Security $hd_hsts always;
        add_header Cache-Control 'no-store' always;
        return 404;
    }
    location /api/ {
        set $api http://api:3320;
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+(?:/(?:gallery|configuration|inspection|price-history))?)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    location / { return 404; }
}
