# Unknown HTTP hosts serve only internal liveness; no catch-all redirect.
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080 default_server;
    server_name _;
    location = /health/proxy { access_log off; return 200 'ok'; }
    location / { return 444; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080;
    server_name cars.hongdingauto.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; try_files $uri =404; }
    location / { return 308 https://cars.hongdingauto.com$request_uri; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8080;
    server_name admin.hongdingauto.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; try_files $uri =404; }
    location / { return 308 https://admin.hongdingauto.com$request_uri; }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl;
    server_name cars.hongdingauto.com;
    if ($ssl_server_name !~* "^cars[.]hongdingauto[.]com$") { return 421; }
    if ($host != cars.hongdingauto.com) { return 421; }
    ssl_certificate /run/tls/current/server.crt;
    ssl_certificate_key /run/tls/current/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    include /etc/nginx/hd-domains/media.conf;
    # Only the current public GET/HEAD API paths are proxied on the public host.
    location ~ "^/api/v1/(?:vehicles(?:/[^/]+)?|vehicle-filters|home/vehicles|media/[^/]+)/?$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $api http://api:3320;
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    include /etc/nginx/hd-domains/external-media-report.conf;
    location = /api { return 404; }
    location /api/ { return 404; }
    location /admin/ { return 404; }
    location = /admin { return 404; }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        include /etc/nginx/hd-domains/web-proxy.conf;
    }
}
server {
    include /etc/nginx/hd-domains/edge-server.conf;
    listen 8443 ssl;
    server_name admin.hongdingauto.com;
    absolute_redirect off;
    if ($ssl_server_name !~* "^admin[.]hongdingauto[.]com$") { return 421; }
    if ($host != admin.hongdingauto.com) { return 421; }
    ssl_certificate /run/tls/current/server.crt;
    ssl_certificate_key /run/tls/current/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    include /etc/nginx/hd-domains/media.conf;
    location = / { return 308 /admin/; }
    location = /admin { return 308 /admin/; }
    location ^~ /admin/assets/ { root /srv; try_files $uri =404; add_header Cache-Control 'no-store' always; }
    location ^~ /admin/ { root /srv; try_files $uri $uri/ /admin/index.html; add_header Cache-Control 'no-store' always; add_header X-Robots-Tag 'noindex, nofollow' always; }
    location ^~ /api/v1/external-media/ { return 404; }
    location /api/ {
        set $api http://api:3320;
        rewrite "^(/api/v1/(?:vehicles(?:/[^/]+)?|vehicle-filters|home/vehicles|media/[^/]+))/$" $1 break;
        resolver 127.0.0.11 valid=10s ipv6=off;
        include /etc/nginx/hd-domains/api-proxy.conf;
    }
    location / { return 404; }
}
