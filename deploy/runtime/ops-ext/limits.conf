# The peer address is assigned by Nginx, never by a request header.
map $uri $ext_auth_peer {
    default "";
    ~*^/api/auth(?:/|$) $binary_remote_addr;
}
map $uri $ext_catalog_peer {
    default "";
    ~^/api/v1/(?:vehicles|vehicle-filters|home/vehicles)(?:/|$) $binary_remote_addr;
}
limit_req_zone $ext_auth_peer zone=ext_auth:1m rate=6r/m;
limit_req_zone $ext_catalog_peer zone=ext_catalog:1m rate=30r/s;
limit_req zone=ext_auth burst=4 nodelay;
limit_req zone=ext_catalog burst=40 nodelay;
limit_req_status 429;
limit_req_log_level info;
