name: hd-auto-translation

x-translation-image: &translation-image libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32

services:
  models:
    profiles: [setup]
    image: *translation-image
    user: "0:0"
    entrypoint: [./venv/bin/python, /translation/bootstrap.py, install]
    volumes:
      - models:/home/libretranslate/.local
      - sentence-models:/home/libretranslate/.cache
      - ./:/translation:ro
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: "no"

  libretranslate:
    image: *translation-image
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - ./venv/bin/python /translation/bootstrap.py verify && exec ./scripts/entrypoint.sh
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: "5000"
      LT_LOAD_ONLY: en,zh,ru
      LT_THREADS: "1"
      LT_CHAR_LIMIT: "5000"
      LT_BATCH_LIMIT: "2"
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_SUGGESTIONS: "false"
      LT_UPDATE_MODELS: "false"
      ARGOS_CHUNK_TYPE: MINISBD
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_INTER_THREADS: "1"
      ARGOS_INTRA_THREADS: "2"
      OMP_NUM_THREADS: "2"
    ports:
      - 127.0.0.1:3340:5000
    volumes:
      - models:/home/libretranslate/.local
      - sentence-models:/home/libretranslate/.cache
      - ./:/translation:ro
    networks: [translation]
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    healthcheck:
      test: [CMD, ./venv/bin/python, /translation/bootstrap.py, health]
      start_period: 30s
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  models:
    name: hd-auto-translation-models-v1
  sentence-models:
    name: hd-auto-translation-sentence-models-v1

networks:
  translation:
    driver: bridge
