# Trial site when TCP 80/443 belong to the existing VPN.
# FIRST confirm TCP 8088 is free; replace this port everywhere if it is not.
# Replace auto.example.com. IP:8088 can also reach this site during trial.
server {
    listen 8088;
    server_name auto.example.com;
    include /etc/nginx/snippets/hd-auto-static.conf;
}
