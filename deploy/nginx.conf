# Initial HTTP site. Use only after checking that TCP 80 is free, or add to an
# existing Nginx after checking its virtual hosts. This is a static site.
# Replace auto.example.com. See docs/服务器部署.md before installing.
server {
    listen 80;
    server_name auto.example.com;
    include /etc/nginx/snippets/hd-auto-static.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hd-auto-acme;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }
}
