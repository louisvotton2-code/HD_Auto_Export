# HTTPS without taking over TCP 80/443. Certificate uses DNS-01 (or an already
# managed certificate for THIS hostname), not HTTP validation on port 8443.
# FIRST confirm TCP 8443 is free. Replace domain, paths and port as applicable.
# Visit https://auto.example.com:8443/ ; HTTPS does not hide the custom port.
server {
    listen 8443 ssl;
    server_name auto.example.com;
    ssl_certificate /etc/letsencrypt/live/auto.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HD_AUTO_TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/hd-auto-static.conf;
}
