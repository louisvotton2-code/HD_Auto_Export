# Include inside ONE HD Auto server block; not inside nginx's top-level context.
# This root contains the CONTENTS of out/, not out/ itself.
root /srv/hd-auto/current;
index index.html;
server_tokens off;

# Keep this inside the HD Auto server: compress static JS/CSS and Next RSC .txt.
# Ubuntu's default gzip_types may cover HTML only. WebP/WOFF stay untouched.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml text/xml image/svg+xml;

access_log /var/log/nginx/hd-auto.access.log;
error_log /var/log/nginx/hd-auto.error.log warn;

# HTML, exported RSC .txt files, metadata and non-hashed assets revalidate.
# Do not give all exported files an immutable cache policy.
add_header Cache-Control "no-cache" always;
error_page 404 /404.html;

location = /404.html {
    internal;
    add_header Cache-Control "no-store" always;
}

# There is no HTTP calculation API, health process or image server in export.
location = /api { return 404; }
location ^~ /api/ { return 404; }
location = /_next/image { return 404; }

location ^~ /_next/static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Do not expose hidden files; the ACME exception is configured separately.
location ~ /\.(?!well-known/) {
    deny all;
}

location / {
    # trailingSlash export creates e.g. /zh/calculator/russia/index.html.
    # Never fall back to /index.html: unknown routes must keep HTTP 404.
    try_files $uri $uri/ =404;
}
