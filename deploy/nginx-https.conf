# Standard HTTPS after DNS, TCP 80/443 checks and certificate issuance.
# Replace auto.example.com in server_name AND both certificate paths.
server {
    listen 80;
    server_name auto.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hd-auto-acme;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 301 https://auto.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name auto.example.com;
    ssl_certificate /etc/letsencrypt/live/auto.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HD_AUTO_TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/hd-auto-static.conf;
}
