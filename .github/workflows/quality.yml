name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: hd_local
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hd_local -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      SITE_INDEXABLE: 'false'
      API_TEST_DATABASE_URL: postgresql://hd_local:local-ci-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify affected applications (manual runs verify everything)
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          VERIFY_FULL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/git-workflow.mjs ci --base "$VERIFY_BASE" --full "$VERIFY_FULL"
