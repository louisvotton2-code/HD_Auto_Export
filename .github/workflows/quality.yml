name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: hd_local
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U hd_local -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      SITE_INDEXABLE: 'false'
      API_TEST_DATABASE_URL: postgresql://hd_local:local-ci-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, module boundaries and unit tests
        run: pnpm check
      - name: Build contracts, API, OpenAPI and applications
        run: pnpm build
      - name: Install browser
        run: pnpm --filter @hd/web exec playwright install --with-deps chrome
      - name: Verify applications in Chrome
        run: pnpm test:e2e
